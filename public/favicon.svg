<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Royal & Electric Blue Multi-Stop Gradient from tttt.png -->
    <linearGradient id="teladuBase" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563eb" />
      <stop offset="28%" stopColor="#0047ff" />
      <stop offset="70%" stopColor="#0038ff" />
      <stop offset="100%" stopColor="#0022b8" />
    </linearGradient>

    <!-- Top-Left Glass Specular Arc Sheen -->
    <linearGradient id="topSheen" x1="50" y1="50" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.45" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </linearGradient>

    <!-- Bottom-Right Dark Royal Wave Curve -->
    <linearGradient id="waveGrad" x1="200" y1="260" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#001888" stopOpacity="0" />
      <stop offset="60%" stopColor="#001477" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#000c55" stopOpacity="0.75" />
    </linearGradient>
  </defs>

  <!-- 1. Background Squircle with Exact Teladu Blue Palette -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#teladuBase)" />

  <!-- 2. Organic Deep Wave Layer in Lower Half -->
  <path
    d="M 24 340 C 140 380 260 300 488 340 L 488 380 C 488 440 440 488 380 488 L 144 488 C 78 488 24 434 24 368 Z"
    fill="url(#waveGrad)"
  />

  <!-- 3. Specular Glass Arc Highlight across Top Left -->
  <path
    d="M 24 144 C 24 78 78 24 144 24 L 368 24 C 410 24 445 45 464 76 C 360 88 200 180 140 320 C 60 270 24 200 24 144 Z"
    fill="url(#topSheen)"
  />

  <!-- 4. Pure White Smiling Waving Hand Silhouette -->
  <g fill="#ffffff">
    <!-- Palm Core -->
    <path
      d="M 160 260 C 140 250 120 270 130 295 C 145 330 170 365 200 385 C 225 400 260 400 290 390 C 325 375 350 340 360 300 C 370 265 350 245 325 245 C 305 245 295 260 290 275 C 285 290 275 310 255 315 C 235 320 220 310 210 295 C 200 280 195 260 160 260 Z"
    />

    <!-- Thumb (Smooth left curve) -->
    <path
      d="M 148 230 C 120 230 100 260 120 290 C 135 315 160 330 185 330 C 195 310 195 280 185 255 C 175 235 160 230 148 230 Z"
    />

    <!-- Index Finger -->
    <rect x="186" y="142" width="40" height="135" rx="20" />

    <!-- Middle Finger (Tallest) -->
    <rect x="238" y="115" width="40" height="165" rx="20" />

    <!-- Ring Finger -->
    <rect x="290" y="135" width="40" height="145" rx="20" />

    <!-- Pinky Finger -->
    <rect x="342" y="172" width="38" height="110" rx="19" />

    <!-- Hand Palm Interlocking Body -->
    <path
      d="M 175 240 L 355 240 C 370 260 365 300 345 335 C 315 385 245 395 195 365 C 165 345 155 310 165 275 Z"
    />

    <!-- The Smiling Mouth Inside Palm (Electric Blue Arc) -->
    <path
      d="M 215 315 C 230 335 268 335 285 315"
      stroke="#0038ff"
      stroke-width="15"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Inner Wave Signal (Above Pinky) -->
    <path
      d="M 374 148 C 398 158 412 182 418 206"
      stroke="#ffffff"
      stroke-width="16"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Outer Wave Signal (Top-Most) -->
    <path
      d="M 388 118 C 424 132 448 165 454 200"
      stroke="#ffffff"
      stroke-width="16"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
